name: Build and Publish Docker Images (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "License.txt"
      - "README.md"
      - "whitematteranalysis/**"
      - "bin/**"
      - "utilities/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "whitematteranalysis/**"
      - "bin/**"
      - "utilities/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push built images to GHCR"
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cu124
            target: gpu
            base_arg: GPU_BASE_IMAGE=pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
            is_default: true
            reclaim_disk: true
          - variant: cu128
            target: gpu
            base_arg: GPU_BASE_IMAGE=pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
            is_default: false
            reclaim_disk: true
          - variant: cpu
            target: cpu
            base_arg: CPU_BASE_IMAGE=python:3.11-slim-bookworm
            is_default: false
            reclaim_disk: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space for large CUDA base images
        if: matrix.reclaim_disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine whether to push
        id: publish_gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" != "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.publish_gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ matrix.is_default && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ matrix.is_default }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
            type=sha,prefix=${{ matrix.variant }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ steps.publish_gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.base_arg }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
