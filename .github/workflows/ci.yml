name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} (CPU)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout repository (full history for baseline parity tests)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install headless VTK system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            libsm6 \
            libxcursor1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrender1 \
            libxt6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with h5 and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[h5,dev]"

      - name: Verify CLI, doctor, and no-torch lazy imports
        run: |
          wma --version
          wma doctor
          python -c "import sys; sys.modules['torch'] = None; import whitematteranalysis as wma; assert hasattr(wma.pipelines, 'ORGParcellationPipeline'); print('NO_TORCH_OK')"

      - name: Run unit test suite (22 modules)
        run: |
          pytest \
            tests/test_packaging_and_cli.py \
            tests/test_pipelines_sdk.py \
            tests/test_org_pipeline_cli.py \
            tests/test_bspline.py \
            tests/test_filter_outliers.py \
            tests/test_atlas_construction.py \
            tests/test_multi_atlas.py \
            tests/test_multigpu_dispatch.py \
            tests/test_memory.py \
            tests/test_gpu_config.py \
            tests/test_distance_kernel.py \
            tests/test_centroid_kernel.py \
            tests/test_embedding_kernel.py \
            tests/test_atlas_blocks.py \
            tests/test_gpu_registration.py \
            tests/test_transform_and_sampling.py \
            tests/test_harden_preparation.py \
            tests/test_harden_workers.py \
            tests/test_atlas_cache.py \
            tests/test_atlas_validation.py \
            tests/test_cpu_atlas.py \
            tests/test_outlier_reductions.py \
            -v
