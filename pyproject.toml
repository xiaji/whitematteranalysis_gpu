[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "whitematteranalysis"
dynamic = ["version"]
description = "GPU-accelerated processing and parcellation of whole-brain streamline tractography."
readme = "README.md"
license = { file = "License.txt" }
requires-python = ">=3.8"
authors = [
    { name = "Fan Zhang and Lauren O'Donnell", email = "odonnell@bwh.harvard.edu" },
]
keywords = ["tractography", "diffusion-mri", "white-matter", "neuroimaging", "cuda", "triton"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "joblib>=1.1.0",
    "matplotlib>=3.5.0",
    "nibabel>=3.0.0",
    "numpy>=1.20.0,<1.21.0; python_version == '3.8'",
    "numpy>=1.21.0; python_version >= '3.9'",
    "pandas>=1.3.0",
    "scipy>=1.4.0,<1.11.0; python_version == '3.8'",
    "scipy>=1.5.0; python_version == '3.9'",
    "scipy>=1.9.0; python_version >= '3.10'",
    "statsmodels>=0.10.0,<0.13.0; python_version == '3.8'",
    "statsmodels>=0.13.0; python_version >= '3.9'",
    "threadpoolctl>=3.1,<3.7",
    "vtk>=9.1.0,<9.2.0; python_version >= '3.8' and python_version <= '3.9'",
    "vtk>=9.2.0; python_version >= '3.10'",
    "xlrd>=2.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4.1",
]
h5 = [
    "h5py>=3.7.0",
]
dev = [
    "pytest>=7.0",
    "setuptools>=64",
]
all = [
    "h5py>=3.7.0",
    "torch>=2.4.1",
]

[project.scripts]
wma = "whitematteranalysis.cli:main"

[project.urls]
Repository = "https://github.com/xiaji/fast-wma"
Upstream = "https://github.com/SlicerDMRI/whitematteranalysis"

[tool.setuptools]
include-package-data = false
script-files = [
    "bin/harden_transform_with_slicer.py",
    "bin/wm_append_clusters.py",
    "bin/wm_append_clusters_to_anatomical_tracts.py",
    "bin/wm_append_diffusion_measures_across_subjects.py",
    "bin/wm_apply_ORG_atlas.py",
    "bin/wm_assess_cluster_location_by_hemisphere.py",
    "bin/wm_average_tract_measures.py",
    "bin/wm_change_nrrd_dir.py",
    "bin/wm_cluster_atlas.py",
    "bin/wm_cluster_from_atlas.py",
    "bin/wm_cluster_remove_outliers.py",
    "bin/wm_cluster_volumetric_measurements.py",
    "bin/wm_compare_vtks.py",
    "bin/wm_create_mrml_file.py",
    "bin/wm_diffusion_measurements.py",
    "bin/wm_download_anatomically_curated_atlas.py",
    "bin/wm_harden_transform.py",
    "bin/wm_preprocess_all.py",
    "bin/wm_quality_control_after_clustering.py",
    "bin/wm_quality_control_cluster_measurements.py",
    "bin/wm_quality_control_tract_overlap.py",
    "bin/wm_quality_control_tractography.py",
    "bin/wm_register_multisubject_faster.py",
    "bin/wm_register_to_atlas_new.py",
    "bin/wm_remove_data_along_tracts.py",
    "bin/wm_separate_clusters_by_hemisphere.py",
    "bin/wm_tract_to_volume.py",
    "bin/wm_vtp2vtk.py",
    "utilities/wm_assess_cluster_location.py",
    "utilities/wm_compute_FA_from_DWIs.py",
    "utilities/wm_compute_TAP.py",
    "utilities/wm_compute_bundle_feature_population_math.py",
    "utilities/wm_extract_cluster.py",
    "utilities/wm_extract_clusters_by_endpoints.py",
    "utilities/wm_fix_UKF_trace.py",
    "utilities/wm_fix_hemisphere_loc_name_in_tractogram.py",
    "utilities/wm_flatten_length_distribution.py",
    "utilities/wm_laterality_all.py",
    "utilities/wm_measure_all_clusters.py",
    "utilities/wm_measure_endpoint_overlap.py",
    "utilities/wm_statistics.py",
    "utilities/wm_statistics_export_data.py",
    "utilities/wm_transform_polydata.py",
]

[tool.setuptools.dynamic]
version = { attr = "whitematteranalysis.__version__" }

[tool.setuptools.packages.find]
include = ["whitematteranalysis*"]
exclude = ["tests*", "bin*", "slicer*", "utilities*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
